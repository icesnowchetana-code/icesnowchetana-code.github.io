<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待辦事項</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="待辦事項">
<meta name="robots" content="noindex">
<style>
body{margin:0;font-family:"PingFang TC","Noto Sans TC",sans-serif;background:#f4efe6;color:#1d2a3d;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;font-size:20px}
img{width:120px;border-radius:26px}
a{display:inline-block;margin-top:18px;padding:12px 26px;background:#1d2a3d;color:#fff;border-radius:12px;text-decoration:none}
p{line-height:1.7}
</style>
</head>
<body>
<div>
<img src="apple-touch-icon.png" alt="">
<p id="msg">正在打開待辦事項…</p>
<a href="https://claude.ai/artifact/E1edsgzB6kiJBBw62wFEBy">打開待辦事項</a>
</div>
<script>
// 網址帶 ?setup 時停在這頁，方便「加入主畫面」；存下來的捷徑網址不含 ?setup，點了就直接跳到待辦事項
var TARGET="https://claude.ai/artifact/E1edsgzB6kiJBBw62wFEBy";
if(location.search.indexOf("setup")>-1){
  history.replaceState(null,"",location.pathname);
  document.getElementById("msg").innerHTML="現在按下方「分享」→「加入主畫面」<br>名稱會自動帶出「待辦事項」";
}else{
  location.replace(TARGET);
}
</script>
</body>
</html>
