name: Today news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - today/fetch_news.py
      - .github/workflows/today-news.yml
permissions:
  contents: write
concurrency:
  group: today-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python today/fetch_news.py
      - name: Commit news
        run: |
          git config user.name "today-bot"
          git config user.email "today-bot@users.noreply.github.com"
          git add today/news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update today news"
          git pull --rebase origin main
          git push
