.list{column-count:2;column-gap:clamp(40px,6vw,96px);padding:0 var(--gutter)}

.line:hover b{color:var(--brass)}
.dir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px clamp(40px,6vw,96px);padding:0 var(--gutter)}
.group b{display:block;padding-bottom:12px;border-bottom:1px solid var(--rule);font:400 19px var(--serif);color:var(--brass)}
.group div{display:flex;flex-wrap:wrap;gap:2px 22px;padding-top:12px}
.group a{display:flex;align-items:center;min-height:44px;color:#D5CFC3}
.group a:hover{color:var(--brass)}
.foot{margin-top:clamp(72px,9vw,128px);padding:30px var(--gutter) calc(30px + env(safe-area-inset-bottom,0px));color:var(--ash);font-size:15px}
.empty{color:var(--ash)}
@media(hover:none){.thumb img{filter:grayscale(.3) contrast(1.03)}}
@media(min-width:721px){.tabs{flex-wrap:wrap;overflow:visible}.ticker{flex-wrap:wrap}}
@media(max-width:1000px){.dir{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{justify-content:flex-start}}
@media(max-width:720px){.top{flex-wrap:wrap;gap:6px 14px;padding-block:14px 4px}.tabs{flex:0 0 100%;order:3;gap:14px}.tabs a{padding:0}.hero{min-height:640px}.hero img{width:100%;height:58%;bottom:auto}.wash{inset:auto -40px -40px -40px;width:auto;height:62%;background:linear-gradient(0deg,var(--ink) 74%,#10121600);filter:none}.fade{display:none}.hero-text{padding:0 var(--gutter) 84px}.hero h1{margin:18px 0 14px}.hero p{margin-bottom:22px}.dots{left:var(--gutter);right:auto;bottom:16px}.chip{flex:0 0 auto;padding:22px 26px 22px 0;margin-right:26px}.card{flex-basis:70vw}.card.lead{flex-basis:84vw}.list{column-count:1}.line:nth-child(n+5){display:none}.dir{grid-template-columns:minmax(0,1fr);gap:36px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.thumb img{transition:none}.card:hover .thumb img{transform:none}}
</style>
